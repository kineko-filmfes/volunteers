<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8/28 ティーンズ作品PRアンケート回答まとめ・名簿</title>
<style>
:root{
  --bg:#faf7f2; --panel:#ffffff; --ink:#1f1b16; --muted:#7a7168; --line:#e7ded1;
  --accent:#e0562d; --accent-soft:#fdeee8;
  --teal:#1f7a6b; --teal-soft:#e3f2ee;
  --violet:#6b4ea8; --violet-soft:#efe9fa;
  --amber:#b1740b; --amber-soft:#fdf1d9;
  --shadow:0 1px 2px rgba(31,27,22,.05), 0 8px 24px rgba(31,27,22,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --panel:#211d17; --ink:#f2ece2; --muted:#a3998b; --line:#352f26;
    --accent:#ff7a4d; --accent-soft:#3a2117;
    --teal:#5fcdb8; --teal-soft:#12302a;
    --violet:#b39ae8; --violet-soft:#241a3a;
    --amber:#e9b949; --amber-soft:#33260d;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:24px;line-height:1.35;margin:0;letter-spacing:.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:6px;letter-spacing:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{
  font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:var(--shadow);transition:.15s;
}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{opacity:.88;color:#fff}

/* drop zone */
#drop{
  border:2px dashed var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:24px;
  background:var(--panel);display:flex;gap:14px;align-items:center;flex-wrap:wrap;transition:.15s;
}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop .d-title{font-weight:700;font-size:14px}
#drop .d-sub{font-size:12.5px;color:var(--muted);line-height:1.6}
#drop .d-text{flex:1;min-width:240px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .n{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.stat.a .n{color:var(--accent)} .stat.t .n{color:var(--teal)} .stat.m .n{color:var(--muted)}

/* tabs */
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:26px 0 20px}
nav.tabs button{
  border:none;border-radius:0;background:none;box-shadow:none;padding:10px 14px;
  font-size:14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
section.pane{display:none} section.pane.on{display:block}

h2{font-size:17px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2:first-child{margin-top:4px}
h2 .cnt{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{background:var(--bg);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.03em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{color:var(--muted);width:34px;font-variant-numeric:tabular-nums}
td.nm{font-weight:700}
.tbl-scroll{overflow-x:auto;border-radius:var(--radius)}
.contact{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.hide-contact .contact-col{display:none}

.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.two{grid-template-columns:1fr}}

/* category cards */
.cat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.cat-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.cat-h h3{margin:0;font-size:16px}
.cat-h .n{font-size:12px;font-weight:700;color:var(--muted)}
.cat-lead{font-size:13px;color:var(--muted);margin:0 0 14px}
.voice{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 13px}
.voice:last-child{margin-bottom:0}
.voice .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.voice .who b{color:var(--ink);font-weight:700}
.voice .txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.cat.c0{border-left:4px solid var(--accent)} .cat.c0 .voice{border-left-color:var(--accent-soft)}
.cat.c1{border-left:4px solid var(--teal)} .cat.c1 .voice{border-left-color:var(--teal-soft)}
.cat.c2{border-left:4px solid var(--violet)} .cat.c2 .voice{border-left-color:var(--violet-soft)}
.cat.c3{border-left:4px solid var(--amber)} .cat.c3 .voice{border-left-color:var(--amber-soft)}

.tag{display:inline-block;font-size:11px;font-weight:700;padding:1.5px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0;white-space:nowrap}

/* todo */
.todo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.todo .t-h{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.04em;margin-bottom:4px}
.todo .t-who{font-size:13px;font-weight:700}
.todo .t-txt{font-size:13.5px;white-space:pre-wrap;margin-top:5px}
.empty{color:var(--muted);font-size:13.5px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);text-align:center}

/* per person */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card .c-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.card .c-h .nm{font-size:15px;font-weight:800}
.card .c-h .fu{font-size:12px;color:var(--muted)}
.qa{margin:0 0 10px}
.qa:last-child{margin-bottom:0}
.qa .q{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.qa .a{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.k{background:var(--accent-soft);color:var(--accent)}
.pill.z{background:var(--teal-soft);color:var(--teal)}
.pill.x{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.age{background:var(--violet-soft);color:var(--violet)}

input[type=search]{
  font:inherit;font-size:13.5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);width:100%;max-width:320px;margin-bottom:14px;
}
.warn{font-size:12.5px;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:9px 13px;margin-bottom:14px;font-weight:600}

/* --- 冒頭サマリー（ベントーUI） --- */
:root{ --c-k:#dd5a2f; --c-z:#3178b8; --c-x:#94897c; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --c-k:#e8663a; --c-z:#4f9cd8; --c-x:#7f766c; } }
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.bt-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow);text-align:left;font:inherit;color:var(--ink)}
.bt-h{font-size:13px;font-weight:800;margin-bottom:11px;line-height:1.45}
.bt-s{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.b-seats{grid-column:span 3;grid-row:span 2}
.b-todo{grid-column:span 1;background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;transition:.15s;
  display:flex;flex-direction:column;justify-content:center}
.b-todo:hover{transform:translateY(-2px)}
.b-todo .bt-h,.b-todo .bt-s{color:#fff;opacity:.92}
.bt-num{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.03em;margin:0}
.b-ratio{grid-column:span 1}
.b-fill{grid-column:span 2}
.b-top{grid-column:span 2}

/* 座席表 */
.seats{display:flex;flex-direction:column;gap:12px}
.seat-row{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center}
.seat-lb{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;line-height:1.3}
.seat-lb b{display:inline-block;margin-left:5px;color:var(--ink);font-size:12.5px}
.seat-set{display:flex;flex-wrap:wrap;gap:5px}
.seat{width:22px;height:19px;border-radius:5px 5px 8px 8px;display:block;flex:0 0 auto}
.seat.s-k{background:var(--c-k)}
.seat.s-z{background:var(--c-z)}
.seat.s-x{background:none;border:1.5px dashed var(--c-x);opacity:.7}
.seat.s-u{background:none;border:1.5px solid var(--line)}
.seat-lg{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:11px;
  border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);font-weight:700}
.seat-lg span{display:flex;align-items:center;gap:6px}
.sw{width:13px;height:12px;border-radius:3px 3px 5px 5px;display:inline-block;flex:0 0 auto}
.sw.s-k{background:var(--c-k)} .sw.s-z{background:var(--c-z)}
.sw.s-x{background:none;border:1.5px dashed var(--c-x)}

/* 割合バー */
.rbar{display:flex;gap:2px;height:13px;margin-bottom:13px}
.rbar i{border-radius:3px;display:block}
.rb-k{background:var(--c-k)} .rb-z{background:var(--c-z)}
.rb-x{background:none;border:1.5px dashed var(--c-x)}
.rl{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px}
.rl-n{color:var(--muted);flex:1;font-size:11.5px}
.rl b{font-weight:800;font-variant-numeric:tabular-nums}
.rl-p{font-size:10.5px;color:var(--muted);width:32px;text-align:right}

/* 記入率・アイデア上位 */
.fr{display:grid;grid-template-columns:minmax(74px,auto) 1fr auto;gap:10px;align-items:center;
  margin-bottom:6px;width:100%;background:none;border:none;box-shadow:none;padding:2px 4px;border-radius:7px}
.fr.jump{cursor:pointer} .fr.jump:hover{background:var(--bg)}
.fr-l{font-size:11.5px;font-weight:700;color:var(--ink);text-align:left;line-height:1.35}
.fr-t{background:var(--bg);border:1px solid var(--line);border-radius:999px;height:9px;overflow:hidden}
.fr-t i{display:block;height:100%;background:var(--accent);border-radius:999px}
.fr-n{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.fr-n em{font-style:normal;margin-left:7px;opacity:.75}

@media(max-width:820px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .b-seats{grid-column:span 2;grid-row:auto}
  .b-fill,.b-top{grid-column:span 2}
  .seat-row{grid-template-columns:84px 1fr;gap:8px}
  .seat-lb{font-size:10.5px}
}
@media(max-width:520px){
  .bento{grid-template-columns:1fr}
  .b-seats,.b-todo,.b-ratio,.b-fill,.b-top{grid-column:span 1}
}
@media print{ .b-todo{background:none!important;color:var(--ink)!important;border-color:var(--line)!important}
  .b-todo .bt-h,.b-todo .bt-s{color:var(--ink)!important}
  .seat,.sw,.rbar i,.fr-t i{-webkit-print-color-adjust:exact;print-color-adjust:exact} }

/* --- 自由記述タブ --- */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.f-l{font-size:12px;font-weight:700;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:12.5px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);cursor:pointer;box-shadow:none;font-weight:600}
.chip b{font-weight:800;margin-left:3px;opacity:.6}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{opacity:.8}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.box.hi{border-left:4px solid var(--violet)}
.box-h{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:baseline;gap:9px}
.box-h .n{font-size:12px;font-weight:700;color:var(--muted)}
.box-lead{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.7}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(120px,1.1fr) 2.4fr auto;gap:12px;align-items:center;
  width:100%;text-align:left;background:none;border:none;box-shadow:none;padding:4px 6px;border-radius:8px;cursor:pointer}
.bar:hover{background:var(--bg)}
.bar .bl{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
.bar .bt{background:var(--bg);border-radius:999px;height:11px;overflow:hidden;border:1px solid var(--line)}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar .bn{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.box.src{border-left:4px solid var(--teal)}
.box.src .bar .bt i{background:var(--teal)}
.bar.plain{cursor:default}
.bar.plain:hover{background:none}
details.raw{margin-top:14px;border-top:1px solid var(--line);padding-top:4px}
details.raw summary{font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;padding:8px 0;list-style:none}
details.raw summary::-webkit-details-marker{display:none}
details.raw summary::before{content:'▸ ';}
details.raw[open] summary::before{content:'▾ ';}
details.raw summary:hover{color:var(--accent)}
.nm-row{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.nm-row b{font-size:13px}
.nm-row .fu{font-size:11.5px;color:var(--muted);white-space:nowrap}
.nm-row .nm-t{font-size:13.5px;white-space:pre-wrap}
@media(max-width:640px){.nm-row{grid-template-columns:1fr}.bar{grid-template-columns:1fr;gap:3px}}
.words{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:0 0 16px;padding:9px 12px;background:var(--bg);border-radius:10px}
.w-l{font-size:11px;font-weight:800;color:var(--muted);margin-right:8px;white-space:nowrap}
.tag.w{background:var(--panel)}
.tag.w b{margin-left:5px;opacity:.55;font-weight:800}
.voice .who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:3px}
.voice .who b{color:var(--ink);font-weight:800;font-size:13px}
.v-meta{font-size:11.5px}
.v-q{font-size:11.5px;opacity:.7;margin-left:auto;text-align:right}
.txt.clip{max-height:4.9em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent)}
button.more{font-size:11.5px;padding:2px 10px;margin-top:5px;box-shadow:none;color:var(--muted)}
.also{margin-top:6px;display:flex;align-items:center;flex-wrap:wrap;gap:0}
.also-l{font-size:10.5px;font-weight:800;color:var(--muted);margin-right:6px}

/* --- スマホ: 出席リストをカード表示に --- */
@media(max-width:640px){
  .tbl-scroll{overflow-x:visible}
  .tbl-scroll table{display:block;border:none;background:none;box-shadow:none;border-radius:0}
  .tbl-scroll thead{display:none}
  .tbl-scroll tbody{display:block}
  .tbl-scroll tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:1px 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;
    padding:10px 13px;margin-bottom:7px;box-shadow:var(--shadow)}
  .tbl-scroll td{display:block;border:none;padding:0}
  .tbl-scroll td.num{grid-column:1;grid-row:1/3;width:auto;font-size:11.5px;padding-top:3px}
  .tbl-scroll td.nm{grid-column:2;grid-row:1;font-size:15px}
  .tbl-scroll td:nth-child(3){grid-column:2;grid-row:2;font-size:12px;color:var(--muted)}
  .tbl-scroll td:nth-child(4){grid-column:3;grid-row:2;font-size:12px;text-align:right}
  .tbl-scroll td:nth-child(5){grid-column:3;grid-row:1;text-align:right}
  .tbl-scroll td.contact-col{grid-column:2/4;font-size:12px}
  h2{font-size:16px;align-items:flex-start}
  .wrap{padding:20px 14px 60px}
  h1{font-size:20px}
  .stats{grid-template-columns:1fr 1fr}
  .v-q{margin-left:0;text-align:left;flex-basis:100%}
}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8}
@media print{
  #drop,nav.tabs,.toolbar,input[type=search],.filters,button.more{display:none!important}
  section.pane{display:block!important;break-inside:auto}
  body{background:#fff}
  /* 折りたたみは全部展開して印刷する */
  .txt.clip{max-height:none!important;-webkit-mask-image:none!important}
  details.raw{display:block!important}
  details.raw>*:not(summary){display:block!important}
  .cat,.box,.card,.todo,.voice{break-inside:avoid}
  .bar .bt i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>8/28 ティーンズ作品PRアンケート回答まとめ・名簿
    <small id="meta">—</small>
  </h1>
  <div class="toolbar">
    <button id="btn-contact" hidden></button>
    <button id="btn-csv">出席リストをCSV保存</button>
    <button id="btn-print">印刷 / PDF</button>
    <button id="btn-reset" hidden>最初のデータに戻す</button>
  </div>
</header>

<div id="drop">
  <div class="d-text">
    <div class="d-title">📄 新しい回答を反映する</div>
    <div class="d-sub">Formzuの管理画面 → 回答ログ → CSVダウンロード。<br>落としたCSVをこの枠に<b>ドラッグ＆ドロップ</b></div>
  </div>
  <button class="primary" id="btn-pick">CSVファイルを選ぶ</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
</div>

<div id="summary"></div>

<nav class="tabs" id="tabs">
  <button data-p="p-list" class="on">出席リスト</button>
  <button data-p="p-cat">自由記述（テーマ別）</button>
  <button data-p="p-q">質問ごと</button>
  <button data-p="p-todo">要対応</button>
  <button data-p="p-all">全回答</button>
</nav>

<section class="pane on" id="p-list"></section>
<section class="pane" id="p-cat"></section>
<section class="pane" id="p-q"></section>
<section class="pane" id="p-todo"></section>
<section class="pane" id="p-all"></section>

<footer>
  <b>このファイルについて</b><br>
  Formzuの回答CSVを読み込んで、出席リストと自由記述を自動で整理して表示します。データはこのファイルの中だけで処理され、どこにも送信されません。<br>
  更新したいときは、Formzuから新しいCSVをダウンロードして、上の枠にドラッグ＆ドロップしてください。
</footer>

/* ============ CSV パーサ ============ */
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(c==='\r'){ /* skip */ }
      else cell+=c;
    }
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
function decodeBytes(buf){
  const u8=new Uint8Array(buf);
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(u8); }
  catch(e){ try{ return new TextDecoder('shift_jis').decode(u8); }
            catch(e2){ return new TextDecoder('utf-8').decode(u8); } }
}

const H = {
  date:  h=>/日時|日付|受信|送信|投稿/.test(h),
  name:  h=>/お?名前|氏名/.test(h) && !/フリガナ|ふりがな|カナ/.test(h),
  kana:  h=>/フリガナ|ふりがな|カナ/.test(h),
  nick:  h=>/ニックネーム|愛称|呼/.test(h),
  mail:  h=>/メール|mail|E-?メール/i.test(h),
  tel:   h=>/電話|TEL/i.test(h),
  age:   h=>/年代|年齢|学年/.test(h),
  join:  h=>/参加方法|参加形式|出席/.test(h),
  skip:  h=>/自動返信|ご了承|同意|確認事項|案内いたします/.test(h),
};
function buildModel(rows){
  const head=rows[0].map(s=>s.trim());
  const idx={date:-1,name:-1,kana:-1,nick:-1,mail:-1,tel:-1,age:-1,join:-1};
  const free=[];
  head.forEach((h,i)=>{
    if(idx.date<0&&H.date(h))      idx.date=i;
    else if(idx.name<0&&H.name(h)) idx.name=i;
    else if(idx.kana<0&&H.kana(h)) idx.kana=i;
    else if(idx.nick<0&&H.nick(h)) idx.nick=i;
    else if(idx.mail<0&&H.mail(h)) idx.mail=i;
    else if(idx.tel<0&&H.tel(h))   idx.tel=i;
    else if(idx.age<0&&H.age(h))   idx.age=i;
    else if(idx.join<0&&H.join(h)) idx.join=i;
    else if(!H.skip(h)&&h)         free.push({i,label:h});
  });
  const clean=v=>(v||'').replace(/\[br\]/g,'\n').replace(/　/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  const people=rows.slice(1).map((r,n)=>({
    n:n+1,
    date: (r[idx.date]||'').trim(),
    name: clean(r[idx.name]) || '（無記名）',
    kana: clean(r[idx.kana]),
    nick: clean(r[idx.nick]),
    mail: (r[idx.mail]||'').trim(),
    tel:  (r[idx.tel]||'').trim(),
    age:  clean(r[idx.age]),
    join: clean(r[idx.join]),
    answers: free.map(f=>({label:f.label, text:clean(r[f.i])})).filter(a=>a.text),
  }));
  return {head, idx, free, people};
}

 ['X（旧Twitter）',/(^|[^A-Za-z])[xX]([^A-Za-z]|$)|twitter/],['YouTube',/youtube|ユーチューブ/i],
 ['Threads',/threads/i],['SNS（媒体名なし）',/(^|[^a-zA-Z])sns([^a-zA-Z]|$)|ソーシャルメディア/i],
 ['友人・知人から',/友人|友達|教え合|紹介/],['家族から',/家族/],['学校',/学校/],
 ['テレビ・CM',/テレビ|(^|[^a-zA-Z])cm([^a-zA-Z]|$)/i],['映画館',/映画館|予告/],
 ['ネット広告',/広告/],['スマホアプリ・検索',/スマホアプリ|ChatGPT|検索/i]];

function matchOf(t){
  const res=[];
  CATS.forEach(c=>{
    const words=c.kw.filter(k=>k[1].test(t)).map(k=>k[0]);
    if(words.length) res.push({cat:c, words, score:words.length});
  });
  return res.sort((a,b)=>b.score-a.score);
}

/* ============ 要対応の検出 ============ */
function todosOf(p){
  const out=[];
  p.answers.forEach(a=>{
    const t=a.text;
    if(/日程|変更|都合|参加が[\s]*可能|のみ参加|参加できま|欠席|遅れ|キャンセル/.test(t))
      out.push({kind:'日程・参加の調整', label:a.label, text:t});
    else if(/でしょうか|ですか[？?]|ますか[？?]|ませんか[？?]|いただけ(ますか|ませんか)/.test(t)
            || (t.length<=14 && /[？?]\s*$/.test(t)))
      out.push({kind:'質問・問い合わせ', label:a.label, text:t});
    else if(/ショック|残念|わかりにくい|分かりにく|困/.test(t))
      out.push({kind:'フォームへのご意見', label:a.label, text:t});
  });
  if(/[?？]|〓/.test(p.name)||/[?？]|〓/.test(p.kana))
    out.push({kind:'お名前が文字化けの可能性', label:'お名前', text:`「${p.name}（${p.kana}）」— 環境依存文字の可能性があります。本人に確認を。`});
  return out;
}

function voice(v){
  const long = v.a.text.length>110;
  const raw = v.a.label.replace(/^[０-９\d][）)]\s*/,'');
  const q = raw.length>22 ? raw.slice(0,22)+'…' : raw;
  return `<div class="voice">
    <div class="who"><b>${esc(v.p.name)}</b><span class="v-meta">${esc(v.p.age||'—')}・${JOIN_LABEL[joinKind(v.p.join)]}</span><span class="v-q">${esc(q)}</span></div>
    <div class="txt${long?' clip':''}">${nl(v.a.text)}</div>
    ${long?'<button class="more">続きを読む</button>':''}
    ${v.tags&&v.tags.length?`<div class="also"><span class="also-l">こんな話も</span>${v.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
  </div>`;
}

/* ============ 自由記述タブ ============ */
let ageFilter='';
function renderCat(){
  const all=M.people;
  const P=all.filter(p=>!ageFilter||p.age===ageFilter);
  const ageCounts={};
  all.forEach(p=>{const a=p.age||'未回答'; ageCounts[a]=(ageCounts[a]||0)+1;});

  const srcQ = M.free.find(f=>/どこから|知ることが多い|情報を知る/.test(f.label));
  const B=new Map(CATS.map(c=>[c.key,{cat:c,voices:[],words:new Map(),people:new Set()}]));
  const other=[];
  P.forEach(p=>p.answers.forEach(a=>{
    if(srcQ && a.label===srcQ.label) return;
    const m=matchOf(a.text);
    if(!m.length){ other.push({p,a,tags:[]}); return; }
    const b=B.get(m[0].cat.key);
    b.voices.push({p,a,tags:m.slice(1).map(x=>x.cat.title)});
    b.people.add(p.name);
    m.forEach(x=>{ const bb=B.get(x.cat.key);
      x.words.forEach(w=>bb.words.set(w,(bb.words.get(w)||0)+1)); });
  }));

  const ranked=[...B.values()].filter(b=>b.voices.length).sort((a,b)=>b.voices.length-a.voices.length);
  const max=ranked.length?ranked[0].voices.length:1;

  /* 年代フィルタ */
  const chips=[['','全員',all.length]]
    .concat(Object.entries(ageCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,k,v]))
    .map(([v,l,n])=>`<button class="chip${ageFilter===v?' on':''}" data-age="${esc(v)}">${esc(l)} <b>${n}</b></button>`).join('');

  /* テーマの多さ */
  const bars = ranked.map(b=>`<button class="bar" data-jump="c-${b.cat.key}">
      <span class="bl">${esc(b.cat.title)}</span>
      <span class="bt"><i style="width:${Math.round(b.voices.length/max*100)}%"></i></span>
      <span class="bn">${b.voices.length}件・${b.people.size}名</span>
    </button>`).join('');

  /* 現状：どこで情報を得ているか */
  let sources='';
  if(srcQ){
    const list=P.map(p=>({p,a:p.answers.find(a=>a.label===srcQ.label)})).filter(x=>x.a);
    if(list.length){
      const cnt=new Map();
      list.forEach(x=>SRCS.forEach(([n,re])=>{ if(re.test(x.a.text)) cnt.set(n,(cnt.get(n)||0)+1); }));
      const rk=[...cnt.entries()].sort((a,b)=>b[1]-a[1]);
      const mx=rk.length?rk[0][1]:1;
      sources=`<div class="box src">
        <div class="box-h">📍 どこで情報を得ているか <span class="n">${list.length}名が回答</span></div>
        <p class="box-lead">設問１の回答。<b>現状であって提案ではありません</b></p>
        <div class="bars">${rk.map(([n,c])=>`<div class="bar plain">
          <span class="bl">${esc(n)}</span>
          <span class="bt"><i style="width:${Math.round(c/mx*100)}%"></i></span>
          <span class="bn">${c}名</span></div>`).join('')}</div>
        <details class="raw"><summary>ひとりずつの回答を見る（${list.length}名）</summary>
          ${list.map(x=>`<div class="nm-row"><b>${esc(x.p.name)}</b><span class="fu">${esc(x.p.age||'—')}</span><span class="nm-t">${nl(x.a.text)}</span></div>`).join('')}
        </details></div>`;
    }
  }

  /* 名前が挙がった人・作品 */
  const infQ = M.free.find(f=>/インフルエンサー|有名人/.test(f.label));
  let names='';
  if(infQ){
    const list=P.map(p=>({p,a:p.answers.find(a=>a.label===infQ.label)})).filter(x=>x.a);
    if(list.length) names=`<div class="box hi">
      <div class="box-h">🎤 名前が挙がった人・作品 <span class="n">${list.length}名が回答</span></div>
      ${list.map(x=>`<div class="nm-row"><b>${esc(x.p.name)}</b><span class="fu">${esc(x.p.age||'—')}</span><span class="nm-t">${nl(x.a.text)}</span></div>`).join('')}
    </div>`;
  }

  const cards = ranked.map((b,i)=>{
    const words=[...b.words.entries()].sort((a,c)=>c[1]-a[1])
      .map(([w,n])=>`<span class="tag w">${esc(w)}<b>${n}</b></span>`).join('');
    return `<div class="cat c${i%4}" id="c-${b.cat.key}">
      <div class="cat-h"><h3>${esc(b.cat.title)}</h3><span class="n">${b.voices.length}件・${b.people.size}名</span></div>
      ${words?`<div class="words"><span class="w-l">出てきた言葉</span>${words}</div>`:''}
      ${b.voices.map(voice).join('')}
    </div>`;
  }).join('');

  document.getElementById('p-cat').innerHTML = `
    <div class="filters"><span class="f-l">年代でしぼる</span>${chips}</div>
    ${P.length?'':'<div class="empty">この年代の回答はありません</div>'}
    ${sources}
    <div class="box"><div class="box-h">💡 どんなアイデアが多く出たか</div>
      <div class="bars">${bars}</div>
      <p class="box-lead" style="margin:12px 0 0">設問２〜５と自由記述。1つの回答は近いテーマ<b>1つだけ</b>に置いています</p>
    </div>
    ${names}
    ${cards}
    ${other.length?`<div class="cat"><div class="cat-h"><h3>その他・分類なし</h3><span class="n">${other.length}件</span></div>
      ${other.map(voice).join('')}</div>`:''}`;
}

/* ============ 冒頭サマリー（ベントーUI） ============ */
function rankAge(a){
  if(/中学/.test(a)) return 13;
  if(/高校/.test(a)) return 16;
  if(/大学|予備校|専門/.test(a)) return 19;
  const m=a.match(/(\d+)/); return m?+m[1]:99;
}
function renderSummary(P){
  const g={k:[],z:[],x:[],u:[]}; P.forEach(p=>g[joinKind(p.join)].push(p));
  const ages=[...new Set(P.map(p=>p.age||'未回答'))].sort((a,b)=>rankAge(a)-rankAge(b));
  const srcQ=M.free.find(f=>/どこから|知ることが多い|情報を知る/.test(f.label));
  const todo=P.reduce((s,p)=>s+todosOf(p).length,0);
  const N=P.length||1;

  /* 座席表 */
  const order='kzxu';
  const seats=ages.map(a=>{
    const list=P.filter(p=>(p.age||'未回答')===a)
      .sort((x,y)=>order.indexOf(joinKind(x.join))-order.indexOf(joinKind(y.join)));
    return `<div class="seat-row">
      <span class="seat-lb">${esc(a)}<b>${list.length}</b></span>
      <span class="seat-set">${list.map(p=>{const k=joinKind(p.join);
        return `<i class="seat s-${k}" title="${esc(p.name)}／${JOIN_LABEL[k]}"></i>`;}).join('')}</span>
    </div>`;
  }).join('');

  /* 参加比率 */
  const seg=['k','z','x'].filter(k=>g[k].length).map(k=>
    `<i class="rb-${k}" style="flex:${g[k].length}" title="${JOIN_LABEL[k]} ${g[k].length}名"></i>`).join('');
  const legend=['k','z','x'].map(k=>`<div class="rl">
      <i class="sw s-${k}"></i><span class="rl-n">${JOIN_LABEL[k]}</span>
      <b>${g[k].length}</b><span class="rl-p">${Math.round(g[k].length/N*100)}%</span></div>`).join('');

  /* 記入率 */
  const fill=ages.map(a=>{
    const list=P.filter(p=>(p.age||'未回答')===a);
    const wrote=list.filter(p=>p.answers.length);
    const chars=wrote.length?Math.round(wrote.reduce((s,p)=>s+p.answers.reduce((t,x)=>t+x.text.length,0),0)/wrote.length):0;
    return {a,n:list.length,w:wrote.length,chars,pct:list.length?Math.round(wrote.length/list.length*100):0};
  });
  const fillRows=fill.map(f=>`<div class="fr">
      <span class="fr-l">${esc(f.a)}</span>
      <span class="fr-t"><i style="width:${f.pct}%"></i></span>
      <span class="fr-n">${f.w}/${f.n}名<em>${f.chars}字</em></span></div>`).join('');

  /* アイデア上位 */
  const cnt=new Map();
  P.forEach(p=>p.answers.forEach(x=>{
    if(srcQ&&x.label===srcQ.label) return;
    const m=matchOf(x.text); if(m.length) cnt.set(m[0].cat,(cnt.get(m[0].cat)||0)+1);
  }));
  const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4);
  const tmax=top.length?top[0][1]:1;
  const topRows=top.map(([c,n])=>`<button class="fr jump" data-goto="${c.key}">
      <span class="fr-l">${esc(c.title)}</span>
      <span class="fr-t"><i style="width:${Math.round(n/tmax*100)}%"></i></span>
      <span class="fr-n">${n}件</span></button>`).join('');

  document.getElementById('summary').innerHTML=`
    <div class="bento">
      <div class="bt-card b-seats">
        <div class="bt-h">回答した${N}名の内訳</div>
        <div class="seats">${seats}</div>
        <div class="seat-lg">
          <span><i class="sw s-k"></i>来社 ${g.k.length}</span>
          <span><i class="sw s-z"></i>Zoom ${g.z.length}</span>
          <span><i class="sw s-x"></i>参加不可 ${g.x.length}</span>
        </div>
      </div>

      <button class="bt-card b-todo" data-tab="p-todo">
        <div class="bt-h">要対応</div>
        <div class="bt-num">${todo}</div>
      </button>

      <div class="bt-card b-ratio">
        <div class="bt-h">参加の割合</div>
        <div class="rbar">${seg}</div>
        ${legend}
      </div>

      <div class="bt-card b-fill">
        <div class="bt-h">年代別の記入率と文字数</div>
        ${fillRows}
      </div>

      <div class="bt-card b-top">
        <div class="bt-h">多く出たアイデア</div>
        ${topRows||'<p class="fr-l">まだアイデアの回答がありません</p>'}
      </div>
    </div>`;
}

const STORE='kineko-volunteer-csv';
function save(text,name){ try{ localStorage.setItem(STORE, JSON.stringify({text,name})); }catch(e){} }
function restore(){ try{ return JSON.parse(localStorage.getItem(STORE)||'null'); }catch(e){ return null; } }
function load(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const text=decodeBytes(r.result);
      const rows=parseCSV(text);
      if(rows.length<2) throw new Error('データ行がありません');
      render(buildModel(rows), file.name);
      save(text, file.name);
      document.getElementById('btn-reset').hidden=false;
    }catch(err){ alert('読み込めませんでした: '+err.message+'\n\nFormzuから「CSV」形式でダウンロードしたファイルか確認してください。'); }
  };
  r.readAsArrayBuffer(file);
}
document.getElementById('btn-reset').onclick=()=>{
  try{ localStorage.removeItem(STORE); }catch(e){}
  render(buildModel(parseCSV(EMBEDDED_CSV)), EMBEDDED_LABEL);
  document.getElementById('btn-reset').hidden=true;
};

/* 初期表示: 前回読み込んだCSVがあればそれを使う */
(function(){
  const s=restore();
  if(s && s.text){
    try{
      render(buildModel(parseCSV(s.text)), s.name+'（この端末に保存されたもの）');
      document.getElementById('btn-reset').hidden=false;
      return;
    }catch(e){}
  }
  render(buildModel(parseCSV(EMBEDDED_CSV)), EMBEDDED_LABEL);
})();
</script>
</body>
